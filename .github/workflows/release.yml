name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build again, for example v2026.43.2
        required: true
permissions:
  contents: read
env:
  TAG: ${{ inputs.tag || github.ref_name }}
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-release-tag.mjs "$TAG"
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Use the runner-provided Chrome browser
        run: google-chrome --version
      - run: PAINT_TEST_PRODUCTION=1 PAINT_TEST_BROWSER_CHANNEL=chrome pnpm test:ui
  create-release:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Create the draft release
        run: |
          # A rerun reuses the existing release; the uploads below replace its assets.
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          cat > notes.md <<EOF
          ## 🇳🇱 Nederlands

          ### Wat is nieuw in $TAG

          OpenAEC Paint Studio is een eenvoudige afbeeldingseditor in OpenAEC-stijl.

          ### Downloads
          - **Windows**: \`*_x64-setup.exe\`, installatie voor de huidige gebruiker (geen admin nodig). Ontbreekt WebView2, dan installeert de installer die zelf.
          - **macOS**: \`*_universal.dmg\` (universeel, Intel en Apple Silicon)
          - **Linux**: \`*_amd64.deb\` of \`*_amd64.AppImage\`

          Controleer een download met \`SHA256SUMS\`.

          ---

          ## 🇬🇧 English

          ### What's new in $TAG

          OpenAEC Paint Studio is a simple image editor in the OpenAEC style.

          ### Downloads
          - **Windows**: \`*_x64-setup.exe\`, installs for the current user (no admin required). If WebView2 is missing, the installer installs it.
          - **macOS**: \`*_universal.dmg\` (universal, Intel and Apple Silicon)
          - **Linux**: \`*_amd64.deb\` or \`*_amd64.AppImage\`

          Check a download against \`SHA256SUMS\`.
          EOF
          gh release create "$TAG" --draft --verify-tag --title "OpenAEC Paint Studio $TAG" --notes-file notes.md
  desktop:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,appimage
            bundle-dir: src-tauri/target/release/bundle
          - os: windows-latest
            bundles: nsis
            bundle-dir: src-tauri/target/release/bundle
          - os: macos-latest
            bundles: app,dmg
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundle-dir: src-tauri/target/universal-apple-darwin/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev
      - name: Check the bundled WebView2 loader
        if: runner.os == 'Windows'
        shell: bash
        run: test -f src-tauri/WebView2Loader.dll || { echo 'src-tauri/WebView2Loader.dll is missing; the installer would lack the WebView2 loader'; exit 1; }
      - run: pnpm install --frozen-lockfile
      - name: Prepare Azure Artifact Signing (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
          AZURE_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_PROFILE: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          # Releases are signed with the organisation's Azure Artifact Signing account.
          foreach ($name in 'AZURE_ENDPOINT', 'AZURE_ACCOUNT', 'AZURE_PROFILE', 'AZURE_CLIENT_ID', 'AZURE_CLIENT_SECRET', 'AZURE_TENANT_ID') {
            if (-not [Environment]::GetEnvironmentVariable($name)) { throw "The organisation signing secret behind $name is not available to this repository" }
          }
          # The Microsoft packages that azure/trusted-signing-action installs, pinned by version and SHA-512.
          $packages = @(
            @{ Id = 'Microsoft.Windows.SDK.BuildTools'; Version = '10.0.26100.4188'; Sha512 = 'OkiRhdDr0ngD6+wm0Ezdu1mgV8ZuknXdHwjzeHVZjYSXi9bCkYkq9Ns/X/ab9BoHb+Tq/5/RmXbdNWtC0qHipQ==' },
            @{ Id = 'Microsoft.ArtifactSigning.Client'; Version = '1.0.128'; Sha512 = 'mPBqaR9Pwvoi8Z3PhVZzPphgf775GjEsRTubB5jMkIja4KyzbjibVSoRtNIyAyR4W4VBwrUQkackwFvF31y/lQ==' }
          )
          $tools = Join-Path $env:RUNNER_TEMP 'signing-tools'
          foreach ($package in $packages) {
            $zip = Join-Path $env:RUNNER_TEMP "$($package.Id).zip"
            Invoke-WebRequest "https://www.nuget.org/api/v2/package/$($package.Id)/$($package.Version)" -OutFile $zip
            $hash = [Convert]::ToBase64String([Security.Cryptography.SHA512]::Create().ComputeHash([IO.File]::ReadAllBytes($zip)))
            if ($hash -ne $package.Sha512) { throw "$($package.Id) $($package.Version) does not match its pinned SHA-512" }
            Expand-Archive $zip -DestinationPath (Join-Path $tools $package.Id)
          }
          $signtool = Join-Path $tools 'Microsoft.Windows.SDK.BuildTools\bin\10.0.26100.0\x64\signtool.exe'
          $dlib = Join-Path $tools 'Microsoft.ArtifactSigning.Client\bin\x64\Azure.CodeSigning.Dlib.dll'
          $metadata = Join-Path $env:RUNNER_TEMP 'artifact-signing-metadata.json'
          @{ Endpoint = $env:AZURE_ENDPOINT; CodeSigningAccountName = $env:AZURE_ACCOUNT; CertificateProfileName = $env:AZURE_PROFILE } | ConvertTo-Json | Set-Content -Path $metadata -Encoding utf8
          # Tauri signs the app, uninstall.exe and the installer with this command.
          $sign = @{ cmd = $signtool; args = @('sign', '/v', '/fd', 'SHA256', '/tr', 'http://timestamp.acs.microsoft.com', '/td', 'SHA256', '/dlib', $dlib, '/dmdf', $metadata, '%1') }
          @{ bundle = @{ windows = @{ signCommand = $sign } } } | ConvertTo-Json -Depth 10 | Set-Content -Path native-signing.json -Encoding utf8
      - name: Prepare Apple signing and notarization (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Releases are signed with the organisation's Developer ID and notarized with its App Store Connect API key.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_CONTENT APPLE_TEAM_ID; do
            test -n "${!name}" || { echo "The organisation signing secret $name is not available to this repository"; exit 1; }
          done
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/apple-api-key.p8"
      - name: Native build
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_PATH: ${{ runner.os == 'macOS' && format('{0}/apple-api-key.p8', runner.temp) || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          AZURE_CLIENT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_TENANT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_TENANT_ID || '' }}
        run: |
          # Empty signing variables still trigger Tauri's certificate importer, so remove them entirely.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_PATH APPLE_TEAM_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID; do
            [ -n "${!name}" ] || unset "$name"
          done
          args=(--bundles '${{ matrix.bundles }}')
          if [ -n '${{ matrix.target }}' ]; then
            args+=(--target '${{ matrix.target }}')
          fi
          if [ -f native-signing.json ]; then
            args+=(--config native-signing.json)
          fi
          pnpm tauri build "${args[@]}"
      - name: Check the Windows signatures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          $signature = Get-AuthenticodeSignature $setup.FullName
          Write-Output "$($setup.Name): $($signature.Status) ($($signature.SignerCertificate.Subject))"
          if ($signature.Status -ne 'Valid') { throw 'The installer is not signed' }
          # Install silently to check what users get, including the WebView2 loader next to the app.
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $location = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\OpenAEC Paint Studio' -ErrorAction SilentlyContinue).InstallLocation
          $dir = if ($location) { $location.Trim('"') } else { Join-Path $env:LOCALAPPDATA 'OpenAEC Paint Studio' }
          foreach ($file in 'openaec-paint-studio.exe', 'uninstall.exe', 'WebView2Loader.dll') {
            $path = Join-Path $dir $file
            if (-not (Test-Path $path)) { throw "$file is missing from $dir" }
            $sig = Get-AuthenticodeSignature $path
            Write-Output "${file}: $($sig.Status) ($($sig.SignerCertificate.Subject))"
            if ($sig.Status -ne 'Valid') { throw "$file is not signed" }
          }
          Start-Process -FilePath (Join-Path $dir 'uninstall.exe') -ArgumentList '/S' -Wait
      - name: Check the macOS signature and notarization
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(find '${{ matrix.bundle-dir }}/dmg' -name '*.dmg' -print -quit)"
          mount="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          app="$(find "$mount" -maxdepth 1 -name '*.app' -print -quit)"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"
          hdiutil detach "$mount"
      - name: Collect installers
        shell: bash
        run: |
          # macOS ships bash 3.2, which has no globstar.
          mkdir release-assets
          find '${{ matrix.bundle-dir }}' -mindepth 2 -maxdepth 2 -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.exe' -o -name '*.dmg' \) | while IFS= read -r file; do
            name="$(basename "$file")"
            cp "$file" "release-assets/${name// /-}"
          done
          shopt -s nullglob
          files=(release-assets/*)
          test ${#files[@]} -gt 0 || { echo 'No installers were built'; exit 1; }
          ls -l release-assets
      - name: Sign installers with the optional release key
        shell: bash
        env:
          RELEASE_KEY: ${{ secrets.PAINT_RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_KEY" ]; then
            echo 'PAINT_RELEASE_SIGNING_KEY is not configured; the installers get no detached signatures.'
            exit 0
          fi
          node scripts/sign-builds.mjs release-assets
      - name: Upload installers to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" release-assets/* --clobber
  checksums:
    needs: desktop
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Add SHA256SUMS to the draft release
        run: |
          mkdir assets
          cd assets
          gh release download "$TAG" --pattern '*.deb' --pattern '*.AppImage' --pattern '*.exe' --pattern '*.dmg'
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber
