<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46464f"/>
      <stop offset="1" stop-color="#2a2a30"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="0.45" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fafaf9"/>
      <stop offset="1" stop-color="#d4d4d8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <!-- The tile: the editor's title bar colour. -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#tile)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>
  <!-- The canvas with its shadow. -->
  <rect x="92" y="108" width="300" height="276" rx="26" fill="#000" fill-opacity="0.35" filter="url(#shadow)" transform="translate(0 14)"/>
  <rect x="92" y="108" width="300" height="276" rx="26" fill="#fafaf9"/>
  <!-- A brush stroke in the editor's accent gradient, ending at the brush. -->
  <path d="M130 330 C 150 262, 196 254, 210 296 S 254 300, 262 252" fill="none" stroke="url(#stroke)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Three palette colours. -->
  <circle cx="140" cy="158" r="17" fill="#dc2626"/>
  <circle cx="186" cy="158" r="17" fill="#2563eb"/>
  <circle cx="232" cy="158" r="17" fill="#16a34a"/>
  <!-- The brush, resting across the corner of the canvas. -->
  <g transform="rotate(-45 356 340)">
    <rect x="336" y="322" width="40" height="170" rx="20" fill="url(#handle)"/>
    <rect x="336" y="286" width="40" height="46" rx="6" fill="#a1a1aa"/>
    <rect x="336" y="300" width="40" height="7" fill="#78716c"/>
    <path d="M336 290 C 336 250, 346 228, 356 210 C 366 228, 376 250, 376 290 Z" fill="#36363e"/>
    <path d="M346 262 C 348 244, 352 232, 356 222 C 360 232, 364 244, 366 262 Z" fill="#f59e0b"/>
  </g>
</svg>
