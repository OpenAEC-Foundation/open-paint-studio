[package]
name = "open-paint-studio"
version = "0.1.0"
edition = "2021"
description = "OpenAEC Paint Studio, native Rust edition"
license = "MIT"
publish = false

[[bin]]
name = "open-paint-studio"
path = "src/main.rs"

[dependencies]
x11rb = { version = "0.13", default-features = false, features = [] }
freetype-rs = "0.38"

[build-dependencies]
png = "0.18"

[profile.release]
# Fat LTO in one unit and no symbols: the smallest program without giving up
# speed (opt-level "s" saves another 66 KB and slows the pixel loops).
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
