[package]
name = "open-paint-studio"
version = "0.1.0"
edition = "2021"
description = "OpenAEC Paint Studio, native Rust edition"
license = "MIT"
publish = false

[[bin]]
name = "open-paint-studio"
path = "src/main.rs"

[dependencies]
x11rb = { version = "0.13", default-features = false, features = [] }
freetype-rs = "0.38"
resvg = { version = "0.49", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp", "ico", "tga", "qoi", "pnm", "hdr", "exr", "dds", "ff"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
